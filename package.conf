# package.conf -- how the pdk's package.yml builds this repository's SIS file (release.yml): the VMware tools for Phorepoc
# (the service, GuestRPC, copy and paste). The service is built against core alone; the kernel side is the PC image's PheBackdoor channel.
NAME=phevmware-tools
ARCHES="x32"
REPOS_x32=""
COMPONENTS_x32="phevmwsvc"
# the add-on archive is of no use (the files are packaged by recipes/pack.py): the SIS file is the product
ADDON=0
